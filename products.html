<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | IMSON™</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="icon" type="image/png" sizes="64x64" href="favicon.png"><link rel="stylesheet" href="styles.css"></head><body>
<header class="site-header"><a class="brand-link" href="index.html"><img class="site-logo" src="imson-logo.png" alt="IMSON™ Infinite Innovation"></a><nav class="site-nav"><a href="index.html">Home</a><a class="active" href="products.html">Products</a><a href="about.html">About Us</a><a href="contact.html">Contact</a><a class="special" href="toner-finder.html">Toner Finder</a><a class="special" href="qr-verification.html">QR Verify</a></nav></header>
<section class="page-hero"><div class="crumb">Home &nbsp;›&nbsp; Products</div><h1>Our Products</h1><p>Explore IMSON toner cartridges and compatible printer solutions.</p></section><main><section class="section"><div class="container"><div class="products-search"><input id="search" placeholder="Search by model, alternate code or printer model..." autocomplete="off"><button class="btn btn-orange" onclick="render()">Search</button></div><div id="status" class="section-sub">Loading live product information...</div><div id="products" class="products-grid"></div></div></section></main><footer class="footer"><div class="brand">IMSON™</div><div class="tag">Infinite Innovation</div><div class="marketed">Marketed by WIZTECH INNOVATION LLP — ISO 9001:2015 Certified</div><div class="contact">Contact: 9727908889</div></footer><script>const SUPABASE_URL='https://jehjwziynmklhstfksfe.supabase.co';const SUPABASE_KEY='sb_publishable_3m0dPOkN4D0gfNXYubmPVg_6wRVC8wZ';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const st=document.getElementById('status');const {data,error}=await db.from('toners').select('*').eq('active',true).order('toner_model');if(error){st.innerHTML='<span style="color:#b42318">Could not load products: '+esc(error.message)+'</span>';return}rows=data||[];render()}function render(){const q=document.getElementById('search').value.toLowerCase().trim();const found=rows.filter(x=>{const printers=Array.isArray(x.printers)?x.printers.join(' '):(x.printers||'');return (String(x.toner_model||'')+' '+String(x.alternate_code||'')+' '+printers).toLowerCase().includes(q)});document.getElementById('status').textContent=found.length+' Product Records Available';const box=document.getElementById('products');if(!found.length){box.innerHTML='<div class="card empty" style="grid-column:1/-1">No matching product found.</div>';return}box.innerHTML=found.map(x=>{const printers=Array.isArray(x.printers)?x.printers:[];const stock=Number(x.stock||0);return '<article class="card product-card"><h3>'+esc(x.toner_model||'IMSON Toner')+'</h3><div class="alt">'+esc(x.alternate_code||'')+'</div><div class="product-meta"><span>₹'+Number(x.selling_rate||0).toLocaleString('en-IN')+'</span><span class="stock">'+(stock>0?'In Stock':'Out of Stock')+'</span></div><div style="margin-top:14px"><b style="color:var(--navy)">Compatible Printers</b><div style="margin-top:6px">'+printers.map(p=>'<span class="badge">'+esc(p)+'</span>').join('')+'</div></div></article>'}).join('')}document.getElementById('search').addEventListener('input',render);document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')render()});load();</script></body></html>
